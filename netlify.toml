[build]
  publish = "."

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/store-catalog"
  to = "/.netlify/functions/store-catalog"
  status = 200

[[headers]]
  for = "/catalog-data.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
